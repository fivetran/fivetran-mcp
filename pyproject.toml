[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fivetran-mcp"
version = "0.3.2"
description = "MCP server for interacting with Fivetran"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.25.0,<2",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.47.0",
    "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
fivetran-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "auth.py", "open-api-definitions"]
